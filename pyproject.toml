[project]
name = "fin-c2-188"
version = "1.0.0"
description = "ExamEvidenceSufficiencyReviewAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# supplied by the platform's own package registry at build time. Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff.lint.per-file-ignores]
# CI has no lint job; ruff is run by hand before push. The violations below are
# inherited from the scaffold master (1574 develop @de793f61) and are suppressed
# per-file so the affected files stay byte-identical to the master — re-syncing
# the scaffold must not produce a diff.
"tests/proof_of_boundary/test_import_isolation.py" = ["F541"]  # byte-identical to master
"tests/proof_of_boundary/test_state_safety.py" = ["F541"]      # byte-identical to master
